[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grepper"
version = "0.1.1"
description = "A lightweight Tkinter GUI tool to search folders/files and (optionally) file content."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Atif Afzal" }]
keywords = ["search", "grep", "tkinter", "utility", "gui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://github.com/themanmakerX/Utility/tree/main/it_utility/grepper#readme"
Repository = "https://github.com/themanmakerX/Utility"
Issues = "https://github.com/themanmakerX/Utility/issues"

[project.scripts]
grepper = "grepper:main"

[tool.setuptools]
py-modules = ["grepper"]
